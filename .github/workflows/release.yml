name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for manual runs)"
        required: false

# GitHub Actions is only the orchestrator here. The actual build lives in
# scripts/build-release.sh, which is runnable locally with the same result.
# This workflow installs the toolchain that script needs, runs it, and uploads
# the artifacts to a GitHub Release.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The whole release toolchain — exact OTP (28.2, the version Burrito
      # publishes precompiled ERTS for), Elixir, zig 0.16 (Burrito requires it
      # exactly), xz — comes from the flake's `release` devShell, the same one
      # a developer uses locally. Nix is the single source of truth for versions,
      # so what CI installs cannot drift from what the build needs. See flake.nix
      # (devShells.release) and scripts/build-release.sh.
      - uses: cachix/install-nix-action@v31

      - name: Build release binaries
        run: nix develop .#release --command scripts/build-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foyer-binaries
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/foyer-*
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Self-contained `foyer` binaries (BEAM runtime bundled — no Erlang
            required). Download the one for your platform, `chmod +x`, run.

            | file | platform |
            | ---- | -------- |
            | `foyer-linux_amd64` | Linux x86_64 |
            | `foyer-linux_arm64` | Linux aarch64 |
            | `foyer-macos_arm64` | macOS Apple Silicon |

            Verify with `sha256sum -c SHA256SUMS`.

            Nix users: `nix profile install github:ducharmemp/foyer` (installs
            the escript, which needs Erlang at runtime), or add the home-manager
            module `foyer.homeModules.foyer`.
