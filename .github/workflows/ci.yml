name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The flake's `checks` runs `mix test` against the pinned Elixir/Erlang,
      # and building the package proves the escript still assembles.
      - name: Test
        run: nix flake check -L
      - name: Build escript
        run: nix build -L .#foyer
