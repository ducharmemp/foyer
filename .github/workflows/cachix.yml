name: Cachix

# Build foyer's nix packages and push their closures to the public cache at
# https://foyer.cachix.org, so the trynix.dev demo link (and any `nix run`)
# fetches a ready-built closure instead of building from source.
#
# cachix-action installs a post-build hook: every store path `nix build`
# realizes after this step runs is pushed to the cache automatically.
#
# Requires the repo secret CACHIX_AUTH_TOKEN (a write token for the `foyer`
# cache). Fork PRs have no secret, so they build without pushing.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CACHIX_CACHE: foyer

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # PRs from forks have no token; build without pushing.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      # Push the WHOLE closure explicitly. cachix-action's post-build hook only
      # sees paths built on this runner, but foyer's dependencies (erlang, jj,
      # nixpkgs) substitute from cache.nixos.org and are never "built" here, so
      # the hook would push almost nothing — the earlier symptom of "runs green,
      # pushes nothing". `cachix push` over the realised closure uploads every
      # path (skipping any the cache already holds), so trynix finds the entire
      # demo closure on foyer.cachix.org.
      #
      # The no-token case (fork PRs) is guarded in bash, not a step `if:` — the
      # `secrets` context is not available in `if:` expressions, only in `with:`
      # and `env:`. So the token rides in via env and the shell decides.
      - name: Build and push foyer packages
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          nix build -L .#foyer .#foyer-demo
          if [ -n "${CACHIX_AUTH_TOKEN}" ]; then
            nix path-info -r .#foyer .#foyer-demo | cachix push "${CACHIX_CACHE}"
          else
            echo "no CACHIX_AUTH_TOKEN (fork PR?); built without pushing"
          fi

      # Print the demo store path so the trynix ?path= link can be updated when
      # the closure hash changes (any source or flake.lock change rebuilds it).
      - name: Report demo store path
        run: |
          echo "foyer-demo store path (for the trynix ?path= link):"
          nix path-info .#foyer-demo
